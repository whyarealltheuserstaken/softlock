[workspace]
resolver = "3"
members = [
    "crates/softlock-core",
    "crates/softlock-windows",
    "crates/softlock-service",
    "crates/softlock-lockhost",
    "crates/softlock-broker",
    "crates/softlock-app/src-tauri",
    "spikes/ctrl-alt-del",
]
# `cargo build --release` builds these crates only. The spike is a member so
# `cargo test --workspace` still runs it, and it is not part of a release build.
default-members = [
    "crates/softlock-core",
    "crates/softlock-windows",
    "crates/softlock-service",
    "crates/softlock-lockhost",
    "crates/softlock-broker",
    "crates/softlock-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.100.0"
