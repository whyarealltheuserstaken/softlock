[workspace]
resolver = "3"
members = [
    "crates/softlock-core",
    "crates/softlock-windows",
    "crates/softlock-service",
    "crates/softlock-lockhost",
    "crates/softlock-broker",
    "crates/softlock-app/src-tauri",
    "spikes/keep-awake",
]

# The keep-awake spike is a member so CI can build and test it. It is not a
# default member, so `cargo build --release` does not produce it.
default-members = [
    "crates/softlock-core",
    "crates/softlock-windows",
    "crates/softlock-service",
    "crates/softlock-lockhost",
    "crates/softlock-broker",
    "crates/softlock-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.100.0"
