[workspace]
resolver = "3"
members = [
    "crates/softlock-core",
    "crates/softlock-windows",
    "crates/softlock-macos",
    "crates/softlock-linux",
    "crates/softlock-service",
    "crates/softlock-lockhost",
    "crates/softlock-seam3",
    "crates/softlock-broker",
    "crates/softlock-app/src-tauri",
]
exclude = [
    "spikes/desktop-proof",
    "spikes/input-hook",
    "spikes/macos-desktop-proof",
    "spikes/macos-keep-awake",
    "spikes/macos-lock-kit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.100.0"
