[workspace]
resolver = "3"
members = [
    "crates/softlock-core",
    "crates/softlock-windows",
    "crates/softlock-service",
    "crates/softlock-lockhost",
    "crates/softlock-broker",
    "crates/softlock-app/src-tauri",
    "spikes/hello-consent",
]
# `cargo build` without `--workspace` builds the product only. The spike is
# still a member, so `cargo test --workspace` and clippy include it.
default-members = [
    "crates/softlock-core",
    "crates/softlock-windows",
    "crates/softlock-service",
    "crates/softlock-lockhost",
    "crates/softlock-broker",
    "crates/softlock-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.100.0"
