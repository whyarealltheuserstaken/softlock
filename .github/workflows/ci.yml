name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: path changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.paths.outputs.shared }}
      linux: ${{ steps.paths.outputs.linux }}
      windows: ${{ steps.paths.outputs.windows }}
      macos: ${{ steps.paths.outputs.macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Path filter self-check
        run: bash .github/ci-path-outputs.sh --self-check
      - name: Classify changed paths (fail closed)
        id: paths
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/ci-path-outputs.sh

  verify-linux:
    name: fmt, clippy, seam 1 (ubuntu-latest)
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (github.ref == 'refs/heads/main' ||
       needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.linux == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: verify-linux
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/softlock-app/package-lock.json
      - name: Linux packages for the desktop shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the front end
        working-directory: crates/softlock-app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --features softlock-core/test-support -- -D warnings
          cargo clippy --workspace --all-targets --features softlock-lockhost/simulated-physical -- -D warnings
          cargo clippy --workspace --all-targets --features softlock-lockhost/dev-launch,softlock-seam3/dev-launch -- -D warnings
          cargo clippy --workspace --all-targets --features softlock-service/live-fail-closed,softlock-lockhost/live-fail-closed,softlock-app/live-fail-closed -- -D warnings
      - name: Core has no Windows-only dependency
        run: cargo build -p softlock-core --all-targets
      - name: Seam 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cargo test --workspace --all-targets --features softlock-core/test-support \
            2>&1 | tee target/seam1.txt
          grep -F "published_schema_accepts_the_default_and_rejects_an_unknown_field ... ok" target/seam1.txt
          grep -F "the_config_path_is_only_the_owner_profile_file ... ok" target/seam1.txt
          grep -F "a_real_sign_in_clears_os_locked_by_the_repair_route ... ok" target/seam1.txt
          grep -F "a_sign_in_repair_lets_the_next_lock_start_and_unlock ... ok" target/seam1.txt
          grep -F "an_absent_value_is_deleted_after_a_restart_mid_lock ... ok" target/seam1.txt
          grep -F "inherited_group_write_aces_lose_write_with_the_owner ... ok" target/seam1.txt
          grep -F "a_locked_file_edit_is_offered_and_an_unlocked_edit_is_saved ... ok" target/seam1.txt
      - name: Live hooks stay shut without the runner gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p softlock-lockhost --features live-fail-closed --lib \
            -- the_magic_extra_stays_injected_until_the_runner_gate_is_open \
               the_test_pin_is_not_typed_when_the_runner_gate_is_shut \
               present_physical_and_the_pin_note_stay_off_when_the_runner_gate_is_shut \
               --test-threads=1 \
            2>&1 | tee target/live-hooks.txt
          grep -F "the_magic_extra_stays_injected_until_the_runner_gate_is_open ... ok" target/live-hooks.txt
          if [ "${OS:-}" = "Windows_NT" ]; then
            grep -F "the_test_pin_is_not_typed_when_the_runner_gate_is_shut ... ok" target/live-hooks.txt
            grep -F "present_physical_and_the_pin_note_stay_off_when_the_runner_gate_is_shut ... ok" target/live-hooks.txt
            cargo test --locked -p softlock-service --features live-fail-closed --lib \
              -- the_pin_environment_is_not_forwarded_when_the_runner_gate_is_shut \
                 an_unlock_from_an_absent_logon_stays_os_locked \
                 the_same_logon_on_the_console_clears_os_locked \
                 --test-threads=1 \
              2>&1 | tee target/live-hooks-service.txt
            grep -F "the_pin_environment_is_not_forwarded_when_the_runner_gate_is_shut ... ok" target/live-hooks-service.txt
            grep -F "an_unlock_from_an_absent_logon_stays_os_locked ... ok" target/live-hooks-service.txt
            grep -F "the_same_logon_on_the_console_clears_os_locked ... ok" target/live-hooks-service.txt
            cargo test --locked -p softlock-service --features simulated-physical,live-fail-closed --lib \
              -- file_clock_returns_none_when_the_runner_may_not_lock \
                 overridden_account_returns_none_when_the_runner_may_not_lock \
                 password_attempts_round_trip_an_owner_returned_boot \
                 password_attempts_round_trip_a_keep_os_lock_revert \
                 --test-threads=1 \
              2>&1 | tee target/password-gates.txt
            grep -F "file_clock_returns_none_when_the_runner_may_not_lock ... ok" target/password-gates.txt
            grep -F "overridden_account_returns_none_when_the_runner_may_not_lock ... ok" target/password-gates.txt
            grep -F "password_attempts_round_trip_an_owner_returned_boot ... ok" target/password-gates.txt
            grep -F "password_attempts_round_trip_a_keep_os_lock_revert ... ok" target/password-gates.txt
          fi
      - name: test-support stays out of product builds
        shell: bash
        run: |
          mkdir -p target
          cargo tree -e no-dev -e features --locked \
            -p softlock-app -p softlock-service -p softlock-lockhost \
            -p softlock-broker -p softlock-windows -p softlock-macos -p softlock-linux \
            > target/product-features.txt
          if grep -F test-support target/product-features.txt; then
            echo "test-support feature reached a product crate"
            exit 1
          fi
          if grep -F simulated-physical target/product-features.txt; then
            echo "simulated-physical feature reached a product crate"
            exit 1
          fi
          if grep -F dev-launch target/product-features.txt; then
            echo "dev-launch feature reached a product crate"
            exit 1
          fi
          if grep -F live-fail-closed target/product-features.txt; then
            echo "live-fail-closed feature reached a product crate"
            exit 1
          fi
      - name: Default test and bin targets omit live-fail-closed
        shell: bash
        run: |
          mkdir -p target
          cargo tree --locked -e normal,dev -e features \
            -p softlock-app -p softlock-service -p softlock-lockhost \
            -p softlock-broker -p softlock-windows -p softlock-macos -p softlock-linux \
            > target/default-targets.txt
          if grep -F live-fail-closed target/default-targets.txt; then
            echo "live-fail-closed reached a default-feature test or bin target"
            exit 1
          fi
      - name: Release binaries omit test-only markers
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked \
            -p softlock-app -p softlock-service -p softlock-lockhost \
            -p softlock-broker -p softlock-windows -p softlock-macos -p softlock-linux
          SOFTLOCK_RELEASE_SCAN_DIR="$PWD/target/release" \
            cargo test --locked -p softlock-lockhost --test release_binary -- --nocapture product_release_binaries \
            2>&1 | tee target/release-scan.txt
          grep -F "scanned release binaries" target/release-scan.txt

