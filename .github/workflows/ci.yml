            -p softlock-broker -p softlock-windows -p softlock-macos -p softlock-linux \
            > target/default-targets.txt
          if grep -F live-fail-closed target/default-targets.txt; then
            echo "live-fail-closed reached a default-feature test or bin target"
            exit 1
          fi
      - name: Release binaries omit test-only markers
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked \
            -p softlock-app -p softlock-service -p softlock-lockhost \
            -p softlock-broker -p softlock-windows -p softlock-macos -p softlock-linux
          SOFTLOCK_RELEASE_SCAN_DIR="$PWD/target/release" \
            cargo test --locked -p softlock-lockhost --test release_binary -- --nocapture product_release_binaries \
            2>&1 | tee target/release-scan.txt
          grep -F "scanned release binaries" target/release-scan.txt

  deny:
    name: licenses and advisories
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (github.ref == 'refs/heads/main' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-deny 0.19.5
        run: |
          curl -fsSL -o cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.5/cargo-deny-0.19.5-x86_64-unknown-linux-musl.tar.gz
          echo "5ea64ae09959b5fe1072d898f95caaa89b374678ba6728d5e9ed1366745479b0  cargo-deny.tar.gz" | sha256sum -c
          tar -xzf cargo-deny.tar.gz
          sudo mv cargo-deny-0.19.5-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/cargo-deny
      - name: Licenses, advisories, and sources
        run: cargo deny check licenses advisories sources

  seam4:
    name: seam 4
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (github.ref == 'refs/heads/main' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/softlock-app/package-lock.json
      - name: Install dependencies
        working-directory: crates/softlock-app
        run: npm ci
      - name: Install Playwright
        working-directory: crates/softlock-app
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: crates/softlock-app
        run: npm run check
      - name: Smoke test
        working-directory: crates/softlock-app
        run: npm run test:e2e

  seam3:
    name: seam 3 (${{ matrix.image }})
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (github.ref == 'refs/heads/main' ||
       needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.windows == 'true')
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: seam3-${{ matrix.image }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/softlock-app/package-lock.json
      - name: Windows target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Front end for the app binary
        working-directory: crates/softlock-app
        run: npm ci && npm run build
      - name: Probe harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cargo test --locked -p softlock-seam3 --target x86_64-pc-windows-msvc -- --nocapture \
            2>&1 | tee target/seam3-probe.txt
          grep -F "probe_window_receives_sendinput_key_and_capture_contains_marker ... ok" target/seam3-probe.txt
          grep -F "registry_device_and_power_snapshots_diff ... ok" target/seam3-probe.txt
      - name: Simulated-physical classifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cargo test --locked -p softlock-lockhost --features simulated-physical --target x86_64-pc-windows-msvc --lib -- --nocapture \
            2>&1 | tee target/seam3-classify.txt
          grep -F "nonce_tagged_injected_event_is_simulated_physical ... ok" target/seam3-classify.txt
      - name: Nonce survives SendInput into the hook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cargo test --locked -p softlock-seam3 --features simulated-physical --target x86_64-pc-windows-msvc --test seam3 -- --nocapture hook_sees_nonce \
            2>&1 | tee target/seam3-hook.txt
          grep -F "hook_sees_nonce_tagged_sendinput_as_simulated_physical ... ok" target/seam3-hook.txt
      - name: Lock host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cargo test --locked -p softlock-seam3 --features dev-launch --target x86_64-pc-windows-msvc --test lock_host -- --test-threads=1 --nocapture \
            2>&1 | tee target/seam3-lock-host.txt
          grep -F "injected_keys_and_clicks_reach_the_probe_while_locked ... ok" target/seam3-lock-host.txt
          grep -F "locking_leaves_keyboard_focus_unchanged ... ok" target/seam3-lock-host.txt
          grep -F "captures_omit_the_overlay_marker ... ok" target/seam3-lock-host.txt
          grep -F "simulated_physical_mouse_does_not_move_the_cursor ... ok" target/seam3-lock-host.txt
          arming=$(grep -E "arming_stays_under_500ms_and_swallows_physical_keys \.\.\. arming took [0-9]+ ms ok" target/seam3-lock-host.txt)
          echo "$arming"
          arming_ms=$(printf '%s\n' "$arming" | grep -oE "arming took [0-9]+" | grep -oE "[0-9]+")
          test "$arming_ms" -lt 500
          grep -F "correct_pin_unlocks_and_wrong_pin_does_not ... ok" target/seam3-lock-host.txt
          grep -F "wts_disconnect_on_an_unused_session_fails ... ok" target/seam3-lock-host.txt
          grep -F "a_correct_pin_during_backoff_stays_locked ... ok" target/seam3-lock-host.txt
          grep -F "backoff_expires_after_the_advanced_time ... ok" target/seam3-lock-host.txt
          grep -F "the_heartbeat_watchdog_fires ... ok" target/seam3-lock-host.txt
          grep -F "both_os_lock_paths_failing_keeps_the_guard_and_retries ... ok" target/seam3-lock-host.txt
          grep -F "a_liveness_miss_fail_closes ... ok" target/seam3-lock-host.txt
          awk '/^test a_window_thread_panic_tries_the_os_lock_then_drops_the_hooks \.\.\./ { found = 1; pending = 1; next }
               pending && /^test / { exit 1 }
               pending && /^ok$/ { pending = 0; exit 0 }
               END { exit (found && !pending ? 0 : 1) }' target/seam3-lock-host.txt
          grep -F "failing_closed_wrong_pins_then_a_correct_pin_during_backoff_stays_locked ... ok" target/seam3-lock-host.txt
          grep -F "failing_closed_correct_pin_releases_after_backoff ... ok" target/seam3-lock-host.txt
          grep -F "a_hook_thread_panic_tries_the_os_lock_then_drops_the_hooks ... ok" target/seam3-lock-host.txt
          awk '/^test a_liveness_thread_panic_tries_the_os_lock_without_trapping_input \.\.\./ { found = 1; pending = 1; next }
               pending && /^test / { exit 1 }
               pending && /^ok$/ { pending = 0; exit 0 }
               END { exit (found && !pending ? 0 : 1) }' target/seam3-lock-host.txt
          # The service panic hook prints before libtest's "ok", so the result
          # is on the same line or the next one. Either shape is a pass.
          awk '{ gsub(/\r/, "") }
               /^test a_callback_panic_tries_the_os_lock_then_drops_the_hooks \.\.\./ {
                 found = 1
                 if ($0 ~ / ok$/) { exit 0 }
                 pending = 1
                 next
               }
               pending && /^test / { exit 1 }
               pending && /^ok$/ { pending = 0; exit 0 }
               END { exit (found && !pending ? 0 : 1) }' target/seam3-lock-host.txt
      - name: Callback panic loop
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p softlock-seam3 --features dev-launch \
            --target x86_64-pc-windows-msvc --test lock_host --no-run \
            --message-format=json > target/lock-host-build.json
          exe_win=$(python .github/lock-host-test-exe.py target/lock-host-build.json)
          exe=$(cygpath -u "$exe_win")
          test -f "$exe"
          passes=0
          for i in $(seq 1 20); do
            "$exe" --exact a_callback_panic_tries_the_os_lock_then_drops_the_hooks --test-threads=1 --nocapture
            passes=$((passes + 1))
          done
          echo "callback panic loop: ${passes} passed"
          test "$passes" -eq 20
      - name: Service authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cargo test --locked -p softlock-service --target x86_64-pc-windows-msvc -- --test-threads=8 \
            2>&1 | tee target/seam2-service.txt
          grep -F "public_requests_never_unlock_from_locked ... ok" target/seam2-service.txt
          grep -F "private_message_on_the_public_pipe_is_rejected ... ok" target/seam2-service.txt
          grep -F "forged_launch_nonce_is_rejected ... ok" target/seam2-service.txt
          grep -F "forged_host_ready_does_not_arm_the_host ... ok" target/seam2-service.txt
          grep -F "forged_host_ready_leaves_the_host_not_ready ... ok" target/seam2-service.txt
          grep -F "verified_nonce_is_single_use ... ok" target/seam2-service.txt
          grep -F "non_console_client_is_rejected ... ok" target/seam2-service.txt
          grep -F "get_status_snapshots_source_and_health ... ok" target/seam2-service.txt
          grep -F "tray_and_app_lock_sources_are_visible_in_get_status ... ok" target/seam2-service.txt
          grep -F "correct_pin_consumes_the_service_nonce ... ok" target/seam2-service.txt
          grep -F "spec_invariant_3_names_the_emergency_path ... ok" target/seam2-service.txt
          grep -F "os_lock_success_moves_to_os_locked_until_the_session_unlocks ... ok" target/seam2-service.txt
          grep -F "another_sessions_lock_does_not_move_the_console ... ok" target/seam2-service.txt
          grep -F "an_invalid_edit_keeps_the_last_good_config ... ok" target/seam2-service.txt
          grep -F "put_config_returns_locked_while_soft_locked_and_while_windows_is_locked ... ok" target/seam2-service.txt
          grep -F "a_stale_base_revision_returns_conflict ... ok" target/seam2-service.txt
          grep -F "an_absent_value_is_deleted_after_a_restart_mid_lock ... ok" target/seam2-service.txt
          grep -F "get_config_and_validate_config_work_for_lock_client ... ok" target/seam2-service.txt
          grep -F "os_locked_password_writes_no_stamp_and_does_not_log_on ... ok" target/seam2-service.txt
          cargo build --locked -p softlock-service -p softlock-lockhost \
            --features softlock-service/simulated-physical,softlock-lockhost/simulated-physical \
            --target x86_64-pc-windows-msvc
          # A file, not a pipe. A lock-host child that outlives cargo keeps a
          # pipe open and tee never sees EOF, so the job sits until timeout.
          # The test process also exits itself after 20 minutes. This wait is
          # the backstop when cargo never starts that process.
          set +e
          cargo test --locked -p softlock-lockhost --features simulated-physical \
            --target x86_64-pc-windows-msvc --test service_session -- --test-threads=1 --nocapture \
            > target/seam3-service.txt 2>&1 &
          pid=$!
          elapsed=0
          while kill -0 "$pid" 2>/dev/null; do
            if [ "$elapsed" -ge 1500 ]; then
              taskkill //F //T //PID "$pid" || true
              echo "cargo test service_session timed out after 1500s" >> target/seam3-service.txt
              break
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          wait "$pid"
          status=$?
          set -e
          cat target/seam3-service.txt
          taskkill //IM softlock-lockhost.exe //F || true
          test "$status" -eq 0
          grep -F "lock_client_lock_blocks_physical_input_and_passes_injected ... ok" target/seam3-service.txt
          grep -F "lock_host_idles_before_lock_and_arms_within_500ms ... service arming took" target/seam3-service.txt
          arming=$(grep -E "lock_host_idles_before_lock_and_arms_within_500ms \.\.\. service arming took [0-9]+ ms ok" target/seam3-service.txt)
          echo "$arming"
          arming_ms=$(printf '%s\n' "$arming" | grep -oE "service arming took [0-9]+" | grep -oE "[0-9]+")
          test "$arming_ms" -lt 500
          grep -F "private_pin_unlocks_and_the_hash_is_not_user_readable ... ok" target/seam3-service.txt
          grep -F "service_log_omits_the_pin_and_the_note ... ok" target/seam3-service.txt
          grep -F "right_password_unlocks_and_wrong_password_does_not ... ok" target/seam3-service.txt
          grep -F "service_log_omits_the_password ... ok" target/seam3-service.txt
          grep -F "another_accounts_password_does_not_unlock ... ok" target/seam3-service.txt
          grep -F "tab_switches_from_pin_to_password ... ok" target/seam3-service.txt
          grep -F "backoff_survives_a_service_restart ... ok" target/seam3-service.txt
          grep -F "password_attempts_stay_under_the_lockout_threshold ... ok" target/seam3-service.txt
          grep -F "lockout-measure threshold=3" target/seam3-service.txt
          awk '{ gsub(/\r/, "") }
               /^test network_logon_lockout_count \.\.\./ {
                 found = 1
                 if ($0 ~ / ok$/) { exit 0 }
                 pending = 1
                 next
               }
               pending && /^test / { exit 1 }
               pending && /^ok$/ { pending = 0; exit 0 }
               END { exit (found && !pending ? 0 : 1) }' target/seam3-service.txt
          grep -F "panic_while_os_lock_is_down_is_closed_by_the_service ... ok" target/seam3-service.txt
          grep -F "emergency_after_both_os_locks_fail_is_closed_by_the_service ... ok" target/seam3-service.txt
          grep -F "installed_service_runs_as_local_system_and_rejects_session_zero ... ok" target/seam3-service.txt
          grep -F "lock_host_token_is_system_in_the_console_session ... ok" target/seam3-service.txt
          grep -F "service_stop_while_locked_keeps_input_blocked ... ok" target/seam3-service.txt
          grep -F "local_system_pin_file_is_rewritten_and_unreadable ... ok" target/seam3-service.txt
          grep -F "standard_user_cannot_plant_the_secret_store ... ok" target/seam3-service.txt
          grep -F "standard_user_cannot_create_the_service_pipe ... ok" target/seam3-service.txt
          grep -F "service_kill_while_locked_stays_guarded_when_os_lock_fails ... ok" target/seam3-service.txt
          grep -F "service_kill_while_locked_releases_only_after_os_lock ... ok" target/seam3-service.txt
          grep -F "impostor_pid_does_not_release_the_guard ... ok" target/seam3-service.txt
          grep -F "impostor_path_does_not_release_the_guard ... ok" target/seam3-service.txt
          grep -F "reused_pid_is_not_trusted_again ... ok" target/seam3-service.txt
          grep -F "several_pipe_instances_accept_at_once ... ok" target/seam3-service.txt
          grep -F "global_hotkey_locks_and_the_probe_confirms ... ok" target/seam3-service.txt
          grep -F "app_subscribe_shows_locked_then_unlocked_after_the_pin ... ok" target/seam3-service.txt
          grep -F "app_quitting_leaves_the_service_running_for_a_lock_client ... ok" target/seam3-service.txt
          grep -F "tray_command_and_app_lock_show_sources_in_get_status ... ok" target/seam3-service.txt
          grep -F "hotkey_unavailable_is_shown_when_registration_fails ... ok" target/seam3-service.txt
          grep -F "changing_the_hotkey_makes_the_new_hotkey_lock ... ok" target/seam3-service.txt
          grep -F "a_closed_subscriber_frees_its_stream_slot ... ok" target/seam3-service.txt
          grep -F "a_locked_file_edit_is_offered_and_applied_on_accept ... ok" target/seam3-service.txt
          grep -F "a_declined_file_edit_restores_the_file_and_keeps_the_old_value ... ok" target/seam3-service.txt
      - name: Service race loops
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p softlock-lockhost --features simulated-physical \
            --target x86_64-pc-windows-msvc --test service_session --no-run \
            --message-format=json > target/service-session-build.json
          exe_win=$(python .github/lock-host-test-exe.py target/service-session-build.json service_session)
          exe=$(cygpath -u "$exe_win")
          test -f "$exe"
          case "$exe" in
            *service_session*) ;;
            *) echo "unexpected test executable: $exe"; exit 1 ;;
          esac
          run_exact() {
            "$exe" --exact "$1" --test-threads=1 --nocapture
          }
          passes=0
          for i in $(seq 1 20); do
            run_exact panic_while_os_lock_is_down_is_closed_by_the_service
            passes=$((passes + 1))
          done
          echo "panic loop: ${passes} passed"
          test "$passes" -eq 20
          passes=0
          for i in $(seq 1 20); do
            run_exact emergency_after_both_os_locks_fail_is_closed_by_the_service
            passes=$((passes + 1))
          done
          echo "emergency loop: ${passes} passed"
          test "$passes" -eq 20
          passes=0
          for i in $(seq 1 20); do
            set +e
            # A file, not a command substitution. A guarded host that outlives
            # the test keeps a pipe open and the loop never reaches the next run.
            run_exact lock_host_idles_before_lock_and_arms_within_500ms > target/arming-one.txt 2>&1
            status=$?
            set -e
            out=$(cat target/arming-one.txt)
            printf '%s\n' "$out"
            test "$status" -eq 0
            ms=$(printf '%s\n' "$out" | grep -oE "service arming took [0-9]+" | grep -oE "[0-9]+" | head -1)
            test -n "$ms"
            test "$ms" -lt 500
            passes=$((passes + 1))
          done
          echo "arming loop: ${passes} passed"
          test "$passes" -eq 20
          passes=0
          for i in $(seq 1 20); do
            run_exact service_kill_while_locked_stays_guarded_when_os_lock_fails
            passes=$((passes + 1))
          done
          echo "kill-fail loop: ${passes} passed"
          test "$passes" -eq 20
          passes=0
          for i in $(seq 1 20); do
            run_exact service_kill_while_locked_releases_only_after_os_lock
            passes=$((passes + 1))
          done
          echo "kill-succeed loop: ${passes} passed"
          test "$passes" -eq 20
          passes=0
          for i in $(seq 1 20); do
            run_exact standard_user_cannot_plant_the_secret_store
            passes=$((passes + 1))
          done
          echo "plant loop: ${passes} passed"
          test "$passes" -eq 20
          passes=0
          for i in $(seq 1 20); do
            run_exact impostor_pid_does_not_release_the_guard
            passes=$((passes + 1))
          done
          echo "impostor loop: ${passes} passed"
          test "$passes" -eq 20
          passes=0
          for i in $(seq 1 20); do
            run_exact impostor_path_does_not_release_the_guard
            passes=$((passes + 1))
          done
          echo "impostor-path loop: ${passes} passed"
          test "$passes" -eq 20
          passes=0
          for i in $(seq 1 100); do
            run_exact reused_pid_is_not_trusted_again
            passes=$((passes + 1))
          done
          echo "reuse loop: ${passes} passed"
          test "$passes" -eq 100
      - name: Release build of the Windows target omits the test feature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cargo build --release --locked --target x86_64-pc-windows-msvc \
            -p softlock-app -p softlock-lockhost -p softlock-service \
            -p softlock-broker -p softlock-windows
          SOFTLOCK_RELEASE_SCAN_DIR="$PWD/target/x86_64-pc-windows-msvc/release" \
            cargo test --locked -p softlock-lockhost --test release_binary -- --nocapture product_release_binaries \
            2>&1 | tee target/windows-release-scan.txt
          grep -F "scanned release binaries" target/windows-release-scan.txt

  linux-hardware:
    name: linux hardware suite --ci
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (github.ref == 'refs/heads/main' ||
       needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.linux == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tests/hardware/linux -> tests/hardware/linux/target
      - name: Format
        run: cargo fmt --manifest-path tests/hardware/linux/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tests/hardware/linux/Cargo.toml --all-targets -- -D warnings
      - name: Suite
        run: |
          set -euo pipefail
          mkdir -p /tmp/linux-hw-out
          ./tests/hardware/linux/run.sh --ci --output-dir /tmp/linux-hw-out
          test -f /tmp/linux-hw-out/result.json
          test -f /tmp/linux-hw-out/result.txt
          python3 tests/hardware/check-schema.py /tmp/linux-hw-out/result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/linux-hw-out/result.json").read_text())
          assert report["schema"] == "softlock-hardware-suite/1"
          assert report["suite"] == "linux"
          assert report["serial_collected"] is False
          assert report["summary"]["fail"] == 0
          print("ci suite ok", report["summary"])
          PY

  ci-ok:
    name: ci ok
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify-linux
      - verify-windows
      - verify-macos
      - deny
      - seam4
      - seam3
      - linux-hardware
    if: always()
    steps:
      - name: Required checks
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local result="$2"
            case "${result}" in
              success | skipped) ;;
              *)
                echo "${name}: ${result}"
                exit 1
                ;;
            esac
          }
          check changes "${{ needs.changes.result }}"
          check verify-linux "${{ needs.verify-linux.result }}"
          check verify-windows "${{ needs.verify-windows.result }}"
          check verify-macos "${{ needs.verify-macos.result }}"
          check deny "${{ needs.deny.result }}"
          check seam4 "${{ needs.seam4.result }}"
          check seam3 "${{ needs.seam3.result }}"
          check linux-hardware "${{ needs.linux-hardware.result }}"