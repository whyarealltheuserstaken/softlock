name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: fmt, clippy, seam 1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/softlock-app/package-lock.json
      - name: Linux packages for the desktop shell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the front end
        working-directory: crates/softlock-app
        run: |
          npm ci
          npm run build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --features softlock-core/test-support -- -D warnings
      - name: Core has no Windows-only dependency
        run: cargo build -p softlock-core --all-targets
      - name: Seam 1
        run: cargo test --workspace --all-targets --features softlock-core/test-support
      - name: test-support stays out of product builds
        shell: bash
        run: |
          mkdir -p target
          cargo tree -e features --locked \
            -p softlock-app -p softlock-service -p softlock-lockhost \
            -p softlock-broker -p softlock-windows -p softlock-macos -p softlock-linux \
            > target/product-features.txt
          if grep -F test-support target/product-features.txt; then
            echo "test-support feature reached a product crate"
            exit 1
          fi

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-deny 0.19.5
        run: |
          curl -fsSL -o cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.5/cargo-deny-0.19.5-x86_64-unknown-linux-musl.tar.gz
          echo "5ea64ae09959b5fe1072d898f95caaa89b374678ba6728d5e9ed1366745479b0  cargo-deny.tar.gz" | sha256sum -c
          tar -xzf cargo-deny.tar.gz
          sudo mv cargo-deny-0.19.5-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/cargo-deny
      - name: Licenses, advisories, and sources
        run: cargo deny check licenses advisories sources

  seam4:
    name: seam 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/softlock-app/package-lock.json
      - name: Install dependencies
        working-directory: crates/softlock-app
        run: npm ci
      - name: Install Playwright
        working-directory: crates/softlock-app
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: crates/softlock-app
        run: npm run check
      - name: Smoke test
        working-directory: crates/softlock-app
        run: npm run test:e2e
