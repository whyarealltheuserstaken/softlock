name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: fmt, clippy, seam 1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/softlock-app/package-lock.json
      - name: Linux packages for the desktop shell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the front end
        working-directory: crates/softlock-app
        run: |
          npm ci
          npm run build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Seam 1
        run: cargo test --workspace --all-targets

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny 0.19.5
        run: |
          curl -fsSL -o cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.5/cargo-deny-0.19.5-x86_64-unknown-linux-musl.tar.gz
          tar -xzf cargo-deny.tar.gz
          sudo mv cargo-deny-0.19.5-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/cargo-deny
      - name: Licenses, advisories, and sources
        run: cargo deny check licenses advisories sources

  seam4:
    name: seam 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/softlock-app/package-lock.json
      - name: Install dependencies
        working-directory: crates/softlock-app
        run: npm ci
      - name: Install Playwright
        working-directory: crates/softlock-app
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: crates/softlock-app
        run: npm run check
      - name: Smoke test
        working-directory: crates/softlock-app
        run: npm run test:e2e
