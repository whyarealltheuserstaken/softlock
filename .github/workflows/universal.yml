name: Universal

# m01 builds both slices on macos-latest (arm64). m11 downloads those fat
# binaries onto GitHub Intel. GitHub said on 19 September 2025 (runner-images
# #13045 and the changelog) that macos-15-intel lasts until August 2027 as the
# last x86_64 image. No end date is published for macos-26-intel. When those
# labels go, the m11 CI evidence disappears.
# https://github.com/actions/runner-images/issues/13045
# https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/
# The native Intel job does not run on push to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: path changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.paths.outputs.shared }}
      macos: ${{ steps.paths.outputs.macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.ref != 'refs/heads/main'
        with:
          filters: |
            shared:
              - Cargo.toml
              - Cargo.lock
              - crates/softlock-core/**
              - crates/softlock-service/**
              - crates/softlock-lockhost/**
              - crates/softlock-broker/**
              - crates/softlock-app/**
              - spikes/macos-desktop-proof/**
              - .github/**
            macos:
              - crates/softlock-macos/**
      - id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "shared=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "shared=${{ steps.filter.outputs.shared }}" >> "$GITHUB_OUTPUT"
            echo "macos=${{ steps.filter.outputs.macos }}" >> "$GITHUB_OUTPUT"
          fi

  universal:
    name: universal 2
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (github.ref == 'refs/heads/main' ||
       needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.macos == 'true')
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: universal-universal2
          workspaces: |
            . -> target
            spikes/macos-desktop-proof -> spikes/macos-desktop-proof/target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/softlock-app/package-lock.json

      - name: Print the runner OS
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}"

      - name: Install both Apple targets
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          rustup target list --installed

      - name: Build the front end
        working-directory: crates/softlock-app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build product crates for both slices
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-apple-darwin \
            -p softlock-app -p softlock-service -p softlock-lockhost \
            -p softlock-broker -p softlock-windows -p softlock-macos -p softlock-linux
          cargo build --release --locked --target aarch64-apple-darwin \
            -p softlock-app -p softlock-service -p softlock-lockhost \
            -p softlock-broker -p softlock-windows -p softlock-macos -p softlock-linux

      - name: Lipo, thin, and scan each slice
        shell: bash
        run: |
          set -euo pipefail
          . "${GITHUB_WORKSPACE}/.github/universal-scan.sh"

          mkdir -p target/universal/fat target/universal/x86_64 target/universal/arm64
          x86_dir="target/x86_64-apple-darwin/release"
          arm_dir="target/aarch64-apple-darwin/release"
          merged=0
          for path in "${arm_dir}"/*; do
            if [ ! -f "${path}" ]; then
              continue
            fi
            if ! lipo -info "${path}" >/dev/null 2>&1; then
              continue
            fi
            kind="$(file -b "${path}")"
            case "${kind}" in
              *executable*) ;;
              *) continue ;;
            esac
            name="$(basename "${path}")"
            other="${x86_dir}/${name}"
            if [ ! -f "${other}" ]; then
              echo "x86_64 build has no ${name}"
              exit 1
            fi
            fat="target/universal/fat/${name}"
            x86_thin="target/universal/x86_64/${name}"
            arm_thin="target/universal/arm64/${name}"
            lipo -create "${other}" "${path}" -output "${fat}"
            echo "=== lipo -info ${fat} ==="
            lipo -info "${fat}"
            echo "=== lipo -archs ${fat} ==="
            lipo -archs "${fat}"
            both_archs "lipo -info" "$(lipo -info "${fat}")"
            both_archs "lipo -archs" "$(lipo -archs "${fat}")"
            require_minos "${fat}"
            lipo -thin x86_64 "${fat}" -output "${x86_thin}"
            lipo -thin arm64 "${fat}" -output "${arm_thin}"
            chmod +x "${fat}" "${x86_thin}" "${arm_thin}"
            # Ad-hoc signature so the arm64 slice can run. Decision D2.
            codesign --force --sign - "${fat}"
            codesign --force --sign - "${x86_thin}"
            codesign --force --sign - "${arm_thin}"
            merged=$((merged + 1))
          done
          if [ "${merged}" -lt 1 ]; then
            echo "no product executable to merge"
            exit 1
          fi
          scan_release target/universal/x86_64 target/universal/x86_64-scan.txt
          scan_release target/universal/arm64 target/universal/arm64-scan.txt
          scan_release target/universal/fat target/universal/fat-scan.txt
          scan_release target/x86_64-apple-darwin/release target/universal/x86_64-crates-scan.txt
          scan_release target/aarch64-apple-darwin/release target/universal/arm64-crates-scan.txt
          for path in target/universal/fat/*; do
            if [ -f "${path}" ]; then
              scan_fails_when_fat_binary_has_markers "${path}"
            fi
          done

      - name: Build the settings app universal binary and scan it
        working-directory: crates/softlock-app
        shell: bash
        run: |
          set -euo pipefail
          # Tauri's own default is 10.13, which would lower only the x86_64 slice.
          # minimumSystemVersion in tauri.conf.json is 11.0.
          npm run tauri build -- --target universal-apple-darwin
          cd "${GITHUB_WORKSPACE}"
          . "${GITHUB_WORKSPACE}/.github/universal-scan.sh"

          stage_universal() {
            path="$1"
            echo "=== lipo -info ${path} ==="
            lipo -info "${path}"
            echo "=== lipo -archs ${path} ==="
            lipo -archs "${path}"
            both_archs "lipo -info" "$(lipo -info "${path}")"
            both_archs "lipo -archs" "$(lipo -archs "${path}")"
            require_minos "${path}"
            name="$(basename "${path}")"
            cp "${path}" "target/universal/tauri/${name}"
            thin="target/universal/arm64/${name}"
            if [ -e "${thin}" ]; then
              thin="target/universal/arm64/universal-${name}"
            fi
            lipo -thin arm64 "${path}" -output "${thin}"
            chmod +x "${thin}"
            # Ad-hoc signature so the arm64 slice can run. Decision D2.
            codesign --force --sign - "${thin}"
          }

          consider_app() {
            path="$1"
            if [ ! -f "${path}" ]; then
              return 0
            fi
            if ! lipo -info "${path}" >/dev/null 2>&1; then
              return 0
            fi
            kind="$(file -b "${path}")"
            case "${kind}" in
              *executable*) ;;
              *) return 0 ;;
            esac
            archs="$(lipo -archs "${path}")"
            case "${archs}" in
              *x86_64*) ;;
              *) return 0 ;;
            esac
            case "${archs}" in
              *arm64*) ;;
              *) return 0 ;;
            esac
            stage_universal "${path}"
            found=$((found + 1))
          }

          mkdir -p target/universal/tauri target/universal/arm64
          found=0
          app_dir="target/universal-apple-darwin/release"
          for path in "${app_dir}"/*; do
            consider_app "${path}"
          done
          if [ "${found}" -lt 1 ] && [ -d "${app_dir}/bundle" ]; then
            for path in $(find "${app_dir}/bundle" -type f); do
              consider_app "${path}"
            done
          fi
          if [ "${found}" -lt 1 ]; then
            echo "universal build produced no Mach-O executable"
            if [ -d target/universal-apple-darwin ]; then
              find target/universal-apple-darwin -type f -print
            fi
            exit 1
          fi
          scan_release target/universal/tauri target/universal/tauri-scan.txt

      - name: Smoke launch the arm64 slice
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          echo "uname -m is ${machine}"
          if [ "${machine}" != "arm64" ]; then
            echo "smoke launch requires an arm64 runner"
            exit 1
          fi

          kill_tree() {
            parent="$1"
            children="$(pgrep -P "${parent}" 2>/dev/null || true)"
            if [ -n "${children}" ]; then
              for child in ${children}; do
                kill_tree "${child}"
              done
            fi
            kill "${parent}" 2>/dev/null || true
          }

          launched=0
          for path in target/universal/arm64/*; do
            if [ ! -f "${path}" ]; then
              continue
            fi
            if ! lipo -info "${path}" >/dev/null 2>&1; then
              continue
            fi
            info="$(lipo -info "${path}")"
            echo "${info}"
            case "${info}" in
              *x86_64*)
                echo "refusing to launch a binary that still contains an x86_64 slice"
                exit 1
                ;;
              *arm64*) ;;
              *)
                echo "thin slice is not arm64: ${info}"
                exit 1
                ;;
            esac
            chmod +x "${path}"
            # Ad-hoc signature so the arm64 slice can run. Decision D2.
            codesign --force --sign - "${path}"
            codesign --verify --verbose=2 "${path}"
            log="target/universal/arm64-smoke-${launched}.log"
            "${path}" >"${log}" 2>&1 &
            pid=$!
            sleep 5
            if kill -0 "${pid}" 2>/dev/null; then
              echo "arm64 slice smoke launch is running: ${path}"
              kill_tree "${pid}"
              sleep 1
              kill -9 "${pid}" 2>/dev/null || true
              wait "${pid}" 2>/dev/null || true
            else
              set +e
              wait "${pid}"
              status=$?
              set -e
              echo "arm64 slice exited ${status}: ${path}"
              cat "${log}"
              if [ "${status}" -ne 0 ]; then
                exit "${status}"
              fi
            fi
            launched=$((launched + 1))
          done
          if [ "${launched}" -lt 1 ]; then
            echo "no arm64 slice to launch"
            exit 1
          fi
          echo "x86_64 slice is not executed"

      - name: Build and lipo the m02 probe
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path spikes/macos-desktop-proof/Cargo.toml \
            --target x86_64-apple-darwin
          cargo build --release --locked --manifest-path spikes/macos-desktop-proof/Cargo.toml \
            --target aarch64-apple-darwin
          mkdir -p target/universal/probe
          x86="spikes/macos-desktop-proof/target/x86_64-apple-darwin/release/macos-desktop-proof"
          arm="spikes/macos-desktop-proof/target/aarch64-apple-darwin/release/macos-desktop-proof"
          fat="target/universal/probe/macos-desktop-proof"
          lipo -create "${x86}" "${arm}" -output "${fat}"
          chmod +x "${fat}"
          # Ad-hoc signature. Decision D2.
          codesign --force --sign - "${fat}"
          echo "=== lipo -info ${fat} ==="
          lipo -info "${fat}"
          echo "=== lipo -archs ${fat} ==="
          lipo -archs "${fat}"

      - name: Hash the fat files in the artifact
        shell: bash
        run: |
          set -euo pipefail
          cd target/universal
          for rel in fat/softlock-app tauri/softlock-app probe/macos-desktop-proof; do
            if [ ! -f "${rel}" ]; then
              echo "missing ${rel} before hashing"
              exit 1
            fi
          done
          shasum -a 256 \
            fat/softlock-app \
            tauri/softlock-app \
            probe/macos-desktop-proof \
            > sha256.txt
          cat sha256.txt

      - name: Upload fat product binaries and the fat probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universal-fat
          path: |
            target/universal/fat
            target/universal/tauri
            target/universal/probe
            target/universal/sha256.txt
          if-no-files-found: error

  native_x86:
    name: native x86_64 (${{ matrix.image }})
    needs: universal
    if: github.event_name != 'push'
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15-intel, macos-26-intel]
    steps:
      - name: Record the Intel runner
        run: |
          set -euo pipefail
          sw_vers
          machine="$(uname -m)"
          echo "uname -m is ${machine}"
          if [ "${machine}" != "x86_64" ]; then
            echo "native x86_64 requires an Intel runner, not Rosetta"
            exit 1
          fi
          if translated="$(sysctl -n sysctl.proc_translated 2>/dev/null)"; then
            echo "sysctl.proc_translated=${translated}"
            if [ "${translated}" != "0" ]; then
              echo "sysctl.proc_translated is not 0; this is Rosetta"
              exit 1
            fi
          else
            echo "sysctl.proc_translated absent"
          fi
          if arm="$(sysctl -n hw.optional.arm64 2>/dev/null)"; then
            echo "hw.optional.arm64=${arm}"
            if [ "${arm}" != "0" ]; then
              echo "hw.optional.arm64 is not 0; this host is Apple silicon"
              exit 1
            fi
          else
            echo "hw.optional.arm64 absent"
          fi
          cputype="$(sysctl -n hw.cputype)"
          echo "hw.cputype=${cputype}"
          if [ "${cputype}" != "7" ]; then
            echo "hw.cputype is not 7; this host is not Intel"
            exit 1
          fi
          brand="$(sysctl -n machdep.cpu.brand_string)"
          echo "machdep.cpu.brand_string=${brand}"
          case "${brand}" in
            *Intel*) ;;
            *)
              echo "machdep.cpu.brand_string does not contain Intel"
              exit 1
              ;;
          esac

      - name: Download the m01 fat binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: universal-fat
          path: m01-fat

      - name: Lipo-check and smoke-launch each fat x86_64 slice
        run: |
          set -euo pipefail

          required=(
            fat/softlock-app
            tauri/softlock-app
            probe/macos-desktop-proof
          )
          for rel in "${required[@]}"; do
            if [ ! -f "m01-fat/${rel}" ]; then
              echo "m01 artifact is missing ${rel}"
              exit 1
            fi
          done
          if [ ! -f m01-fat/sha256.txt ]; then
            echo "m01 artifact is missing sha256.txt"
            exit 1
          fi
          echo "=== sha256 before codesign ==="
          (cd m01-fat && shasum -a 256 -c sha256.txt)

          require_fat() {
            path="$1"
            echo "=== lipo -info ${path} ==="
            info="$(lipo -info "${path}")"
            echo "${info}"
            echo "=== lipo -archs ${path} ==="
            archs="$(lipo -archs "${path}")"
            echo "${archs}"
            case "${info}" in
              *x86_64*) ;;
              *) echo "lipo -info missing x86_64: ${info}"; exit 1 ;;
            esac
            case "${info}" in
              *arm64*) ;;
              *) echo "lipo -info missing arm64: ${info}"; exit 1 ;;
            esac
            case "${archs}" in
              *x86_64*) ;;
              *) echo "lipo -archs missing x86_64: ${archs}"; exit 1 ;;
            esac
            case "${archs}" in
              *arm64*) ;;
              *) echo "lipo -archs missing arm64: ${archs}"; exit 1 ;;
            esac
          }

          kill_tree() {
            parent="$1"
            children="$(pgrep -P "${parent}" 2>/dev/null || true)"
            if [ -n "${children}" ]; then
              for child in ${children}; do
                kill_tree "${child}"
              done
            fi
            kill "${parent}" 2>/dev/null || true
          }

          ensure_signature() {
            path="$1"
            chmod +x "${path}"
            if codesign --verify "${path}" >/dev/null 2>&1; then
              echo "codesign already valid: ${path}"
            else
              # Ad-hoc signature. Decision D2.
              codesign --force --sign - "${path}"
            fi
          }

          smoke_launch() {
            path="$1"
            ensure_signature "${path}"
            log="m01-fat/smoke-$(basename "${path}").log"
            "${path}" >"${log}" 2>&1 &
            pid=$!
            sleep 5
            if kill -0 "${pid}" 2>/dev/null; then
              echo "x86_64 slice smoke launch is running: ${path}"
              kill_tree "${pid}"
              sleep 1
              kill -9 "${pid}" 2>/dev/null || true
              wait "${pid}" 2>/dev/null || true
            else
              set +e
              wait "${pid}"
              status=$?
              set -e
              echo "x86_64 slice exited ${status}: ${path}"
              cat "${log}"
              if [ "${status}" -ne 0 ]; then
                exit "${status}"
              fi
            fi
          }

          launched=0
          for rel in "${required[@]}"; do
            path="m01-fat/${rel}"
            require_fat "${path}"
            if [ "${rel}" = "probe/macos-desktop-proof" ]; then
              ensure_signature "${path}"
              "${path}" --smoke --runner-image "${{ matrix.image }}" --output-dir proof-output \
                | tee m01-fat/probe-smoke.txt
              grep -F "uname -m" m01-fat/probe-smoke.txt
              grep -Fx "x86_64" m01-fat/probe-smoke.txt
              grep -F "hw.cputype=7" m01-fat/probe-smoke.txt
              grep -F "Intel" m01-fat/probe-smoke.txt
              grep -F "native-intel=true" m01-fat/probe-smoke.txt
              grep -F "rosetta=false" m01-fat/probe-smoke.txt
              grep -F "cg-main-display-id=" m01-fat/probe-smoke.txt
              grep -F "cg-main-display-bounds=" m01-fat/probe-smoke.txt
              grep -Fx "cg-session-dictionary=non-null" m01-fat/probe-smoke.txt
              grep -Fx "sac-lock-symbol=resolved" m01-fat/probe-smoke.txt
              grep -F "sac-lock-called=false" m01-fat/probe-smoke.txt
              grep -Fx "smoke=pass" m01-fat/probe-smoke.txt
            else
              smoke_launch "${path}"
            fi
            launched=$((launched + 1))
          done
          echo "smoked ${launched} fat binaries on native x86_64"

  universal-ok:
    name: universal ok
    runs-on: ubuntu-latest
    needs:
      - changes
      - universal
      - native_x86
    if: always()
    steps:
      - name: Required checks
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local result="$2"
            case "${result}" in
              success | skipped) ;;
              *)
                echo "${name}: ${result}"
                exit 1
                ;;
            esac
          }
          check changes "${{ needs.changes.result }}"
          check universal "${{ needs.universal.result }}"
          check native_x86 "${{ needs.native_x86.result }}"
