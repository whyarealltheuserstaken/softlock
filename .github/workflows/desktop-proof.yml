name: Desktop proof

# Review follow-up measurement: https://github.com/whyarealltheuserstaken/softlock/actions/runs/43807392388

# Manual runs, and pull requests that touch the probe or this file.
# No push trigger: a push to main after merge must not install the SYSTEM service.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spikes/**'
      - '.github/workflows/desktop-proof.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  proof:
    name: desktop proof (${{ matrix.image }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop-proof-${{ matrix.image }}
          workspaces: spikes/desktop-proof -> spikes/desktop-proof/target
      - name: Record the runner session
        shell: powershell
        continue-on-error: true
        run: |
          cmd /c "query user"
          cmd /c "query session"
          Write-Output "ImageOS=$env:ImageOS"
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' | Select-Object ProductName, DisplayVersion, CurrentBuild, InstallationType, EditionID | Format-List
          exit 0
      - name: Format
        run: cargo fmt --manifest-path spikes/desktop-proof/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path spikes/desktop-proof/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path spikes/desktop-proof/Cargo.toml
      - name: Run the desktop proof
        shell: cmd
        run: cargo run --release --manifest-path spikes/desktop-proof/Cargo.toml -- --runner-image ${{ matrix.image }} --output-dir proof-output
      - name: Remove the throwaway service
        if: always()
        shell: powershell
        run: |
          $svc = 'RunnerDesktopProbe'
          sc.exe stop $svc
          sc.exe delete $svc
          exit 0
