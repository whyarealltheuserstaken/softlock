name: OS lock proof

# Last and isolated. The proof can lock or disconnect the runner session.
# Nothing in this workflow waits on the proof job. No push trigger: a push to
# main must not apply lockdown policies or install OsLockProbe.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spikes/os-lock/**'
      - 'docs/findings/04-os-lock.md'
      - '.github/workflows/os-lock-proof.yml'
      - 'crates/softlock-core/tests/os_lock_isolation.rs'

permissions:
  contents: read

concurrency:
  group: os-lock-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: spikes/os-lock -> spikes/os-lock/target
      - name: Format, clippy, and tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path spikes/os-lock/Cargo.toml -- --check
          cargo clippy --manifest-path spikes/os-lock/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path spikes/os-lock/Cargo.toml --locked
      - name: Restore self-check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File spikes\os-lock\run.ps1 --self-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  proof:
    name: proof (${{ matrix.image }})
    needs: checks
    runs-on: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: spikes/os-lock -> spikes/os-lock/target
      - name: Time the three lock paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File spikes\os-lock\run.ps1 --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore policies and remove the probe service
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          powershell -ExecutionPolicy Bypass -File spikes\os-lock\restore.ps1 -Journal C:\ProgramData\os-lock-probe\pending.json
          sc.exe stop OsLockProbe
          sc.exe delete OsLockProbe
          schtasks.exe /Delete /TN os-lock-restore /F
          cmd.exe /c rmdir /s /q C:\ProgramData\os-lock-probe
          exit 0
      - name: Upload the proof report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os-lock-${{ matrix.image }}
          path: suite-output/**/result.*
          if-no-files-found: warn
