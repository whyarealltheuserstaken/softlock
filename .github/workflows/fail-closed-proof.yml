name: Fail-closed proof

# Manual runs, and pull requests that touch the probe or this file.
# No push trigger: a push to main after merge must not install the SYSTEM service
# or change lockdown policies on a runner.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spikes/fail-closed-proof/**'
      - '.github/workflows/fail-closed-proof.yml'

permissions:
  contents: read

concurrency:
  group: fail-closed-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: fail-closed proof (${{ matrix.image }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: spikes/fail-closed-proof -> spikes/fail-closed-proof/target
      - name: Record the runner session
        shell: powershell
        continue-on-error: true
        run: |
          cmd /c "query user"
          cmd /c "query session"
          Write-Output "ImageOS=$env:ImageOS"
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' | Select-Object ProductName, DisplayVersion, CurrentBuild, InstallationType, EditionID | Format-List
          exit 0
      - name: Format
        run: cargo fmt --manifest-path spikes/fail-closed-proof/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path spikes/fail-closed-proof/Cargo.toml --all-targets -- -D warnings
      - name: Clippy panic-after-arm
        run: cargo clippy --manifest-path spikes/fail-closed-proof/Cargo.toml --all-targets --features panic-after-arm -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path spikes/fail-closed-proof/Cargo.toml
      - name: Build the probe
        run: cargo build --release --manifest-path spikes/fail-closed-proof/Cargo.toml
      # Restore proof: taskkill /F, CTRL_BREAK_EVENT, and --panic-after-arm.
      # Each case runs --arm-and-wait, then --check-restored and --revert.
      - name: Prove restore after taskkill
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File spikes/fail-closed-proof/ci/restore-check.ps1 -Mode kill -Exe spikes/fail-closed-proof/target/release/fail-closed-proof.exe
      - name: Prove restore after Ctrl+Break
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File spikes/fail-closed-proof/ci/restore-check.ps1 -Mode ctrl -Exe spikes/fail-closed-proof/target/release/fail-closed-proof.exe
      - name: Build the panic-after-arm probe
        run: cargo build --release --manifest-path spikes/fail-closed-proof/Cargo.toml --features panic-after-arm --target-dir spikes/fail-closed-proof/target/panic-arm
      - name: Prove restore after panic
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File spikes/fail-closed-proof/ci/restore-check.ps1 -Mode panic -Exe spikes/fail-closed-proof/target/panic-arm/release/fail-closed-proof.exe
      - name: Run the fail-closed proof
        shell: cmd
        run: cargo run --release --manifest-path spikes/fail-closed-proof/Cargo.toml -- --runner-image ${{ matrix.image }} --output-dir proof-output
      - name: Show the proof logs
        if: always()
        shell: powershell
        run: |
          foreach ($name in @('report.txt', 'proof.log', 'service.log')) {
            $path = Join-Path 'proof-output' $name
            Write-Output "----- $path -----"
            if (Test-Path $path) { Get-Content -Raw $path } else { Write-Output '(missing)' }
          }
          exit 0
      - name: Restore policies and remove the throwaway service
        if: always()
        shell: powershell
        run: |
          cargo run --release --manifest-path spikes/fail-closed-proof/Cargo.toml -- --revert --output-dir proof-output
          sc.exe stop FailClosedProbe
          sc.exe delete FailClosedProbe
          exit 0
