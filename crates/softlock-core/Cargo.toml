[package]
name = "softlock-core"
description = "Shared lock logic with no operating-system calls."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[features]
test-support = []

[dev-dependencies]
insta = { version = "1.49.0", default-features = false, features = ["json"] }
proptest = "1.12.0"

[dependencies]
getrandom = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# Pinned: a newer 0.8 pulls toml_datetime 0.6.11, which fights the GTK macros.
toml = "=0.8.2"
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }

[[test]]
name = "seam1"
required-features = ["test-support"]

[[test]]
name = "windows_dep"

[[test]]
name = "doc_lint"

[[test]]
name = "name_guard"

[[test]]
name = "publish_guard"
