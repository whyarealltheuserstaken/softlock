[package]
name = "softlock-lockhost"
description = "Interactive lock host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Test-only. Release builds do not enable this. Injected events whose
# extra-info matches the per-run nonce are classified as simulated-physical.
simulated-physical = ["dep:getrandom"]

[dependencies]
getrandom = { version = "0.2.16", optional = true }
