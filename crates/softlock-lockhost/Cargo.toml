[package]
name = "softlock-lockhost"
description = "Interactive lock host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Test-only. Release builds do not enable this. Injected events whose
# extra-info matches the per-run nonce are classified as simulated-physical.
simulated-physical = []
# Dev-only marker. Release builds do not enable this. The lock host no longer
# hashes a PIN or draws its own nonce.
dev-launch = []

[dependencies]
getrandom = "0.2.16"

[dev-dependencies]
softlock-seam3 = { path = "../softlock-seam3" }
softlock-service = { path = "../softlock-service" }

[target.'cfg(windows)'.dev-dependencies]
softlock-windows = { path = "../softlock-windows" }

[target.'cfg(windows)'.dependencies]
softlock-core = { path = "../softlock-core" }
softlock-windows = { path = "../softlock-windows" }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "softlock-lockhost"
path = "src/main.rs"
