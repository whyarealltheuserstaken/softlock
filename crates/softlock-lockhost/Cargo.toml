[package]
name = "softlock-lockhost"
description = "Interactive lock host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Test-only. Release builds do not enable this. Injected events whose
# extra-info matches the per-run nonce are classified as simulated-physical.
simulated-physical = ["dep:getrandom"]
# Dev-only launch. Release builds do not enable this.
dev-launch = ["dep:softlock-core", "dep:zeroize", "dep:windows"]

[dependencies]
getrandom = { version = "0.2.16", optional = true }
softlock-core = { path = "../softlock-core", optional = true }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "softlock-lockhost"
path = "src/main.rs"
required-features = ["dev-launch"]
