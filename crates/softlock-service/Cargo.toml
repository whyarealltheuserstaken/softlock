[package]
name = "softlock-service"
description = "Background service. The lock authority."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Test-only. Release builds do not enable this. It lets CI stub the OS lock
# and ask the Lock Host to panic. The cargo-tree check rejects it on a
# product build.
simulated-physical = []

[dependencies]
serde_json = "1"
softlock-core = { path = "../softlock-core" }
tracing = "0.1.41"
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
softlock-windows = { path = "../softlock-windows" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
insta = { version = "1.49.0", default-features = false, features = ["json"] }
proptest = "1.12.0"

[[bin]]
name = "softlock-service"
path = "src/main.rs"
