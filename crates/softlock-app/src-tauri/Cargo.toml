[package]
name = "softlock-app"
description = "Desktop shell."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The lib name has to differ from the package name or Windows links the
# library and the binary to the same file.
[lib]
name = "softlock_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
softlock-core = { path = "../../softlock-core" }
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
softlock-linux = { path = "../../softlock-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
softlock-macos = { path = "../../softlock-macos" }
