[package]
name = "macos-desktop-proof"
description = "Throwaway macOS desktop probe. Excluded from the product workspace."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.100.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
