[package]
name = "macos-lock-kit"
description = "Throwaway macOS lock-path kit. Excluded from the product workspace."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.100.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softlock-macos = { path = "../../crates/softlock-macos" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
